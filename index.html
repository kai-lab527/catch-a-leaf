<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Catch-a-Leaf</title>
  <link rel="icon" type="image/png" sizes="32x32" href="Sprites/normal_maple_leaf.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="Loading.css">
  <link rel="stylesheet" href="Upgrades.css">
  <link rel="stylesheet" href="Shop.css">
  <link rel="stylesheet" href="Intro.css">
</head>
<body>
  <!-- LOADING SCREEN -->
  <div id="loadingScreen" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas id="lsCanvas"></canvas>
    <div class="ls-stack">
      <div class="ls-binslot" id="lsBinSlot"></div>
      <div class="ls-bar"><div class="ls-segs" id="lsSegs"></div></div>
      <div class="ls-status">
        <span class="ls-label" id="lsLabel">Loading</span>
        <span class="ls-pct" id="lsPct">0%</span>
      </div>
    </div>
  </div>
  <script src="LoadingScreen.js"></script>

  <div id="gameContainer">
    <!-- HUD -->
    <div id="hud" class="hidden">
      
      <!-- TOP LEFT: Skill Button -->
      <button id="skillBtn" class="skill-btn hud-pos-topleft" aria-label="Skill" title="Skill"></button>

      <!-- BOTTOM CENTER: All Stat Cards -->
      <div class="hud-bottom-stats">
        
        <!-- MONEY -->
        <div class="hud-stat stat-money" id="moneyCard">
          <span class="hud-icon money-coin" id="moneyIcon">¢</span>
          <div class="hud-info">
            <span class="hud-label">MONEY</span>
            <span class="hud-value" id="moneyValue">0</span>
          </div>
        </div>

        <!-- LEVEL -->
        <div class="hud-stat stat-level" id="levelCard">
          <div class="hud-info">
            <span class="hud-label">LEVEL</span>
            <span class="hud-value" id="levelValue">1</span>
            <span class="hud-xp-text" id="levelXpText">0 / 50</span>
          </div>
          <div class="level-xp-track">
            <div class="level-xp-fill" id="levelXpFill" style="width:0%"></div>
          </div>
        </div>
        <div id="comboBar" aria-label="Combo meter">
          <div id="comboText">COMBO x0</div>
          <div id="comboFill"></div>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
      <div id="floatingText"></div>
      <!-- START SCREEN -->
      <div id="startScreen">
        <div class="title-glow">
          <div class="menu-leaves" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="game-logo" aria-label="Catch-a-leaf demo">
            <span class="logo-demo">Still in development. </span><span class="logo-name">CATCH-A-LEAF</span>
          </div>
          <div id="mainMenu" class="main-menu" aria-label="Main menu">
            <button id="startBtn" class="menu-btn menu-start" type="button">Start</button>
            <button id="quitBtn" class="menu-btn menu-quit" type="button">Quit</button>
          </div>
          <div id="quitMessage" class="quit-message" aria-live="polite">
            <p>Nothing to see here.</p>
          </div>
        </div>
      </div>

      <div id="gameTransition" aria-hidden="true"></div>

      <!-- SHOP -->
      <div id="shopOverlay" class="shop-overlay" aria-hidden="true">
        <div class="shop-shell" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
          <div class="shop-checker" aria-hidden="true"></div>
          <header class="shop-header">
            <div>
              <h2 id="shopTitle">STUMP <span>&amp;</span> STUFF</h2>
              <p>Leaf-Mart. No refunds. No questions. Some squirrels.</p>
            </div>
            <div class="shop-actions">
              <div class="shop-wallet" aria-label="Money"><span>¢</span> <strong id="shopMoney">0</strong></div>
              <button id="shopClose" class="shop-close" type="button" aria-label="Close shop">×</button>
            </div>
          </header>
          <nav class="shop-tabs" role="tablist" aria-label="Shop categories">
            <button id="shopTabUpgrades" class="shop-tab is-active" type="button" role="tab" aria-selected="true">Upgrades</button>
            <button id="shopTabLeaves" class="shop-tab" type="button" role="tab" aria-selected="false">Leaf Varieties</button>
          </nav>
          <div class="shop-layout">
            <div id="shopGrid" class="shop-grid" aria-label="Shop upgrades"></div>
            <aside class="shop-detail" aria-live="polite">
              <div class="detail-art" id="shopDetailArt" aria-hidden="true">SS</div>
              <h3 id="shopDetailName">Spicy Streak</h3>
              <p id="shopDetailEffect">+25% combo bonus</p>
              <div class="detail-meter" id="shopDetailMeter" aria-hidden="true"></div>
              <p class="detail-copy" id="shopDetailCopy">Coins only. No skill points. No homework.</p>
              <div class="detail-price"><span>PRICE</span><strong>¢ <b id="shopDetailPrice">700</b></strong></div>
              <button id="shopBuy" class="shop-buy" type="button">BUY IT</button>
            </aside>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="GameObject.js"></script>
  <script src="Particle.js"></script>
  <script src="Leaf.js"></script>
  <script src="Hazard.js"></script>
  <script src="Player.js"></script>
  <script src="AudioManager.js"></script>
  <script src="Format.js"></script>
  <script src="Devicemode.js"></script>
  <script src="Game.js"></script>
  <script src="SkillButton.js"></script>
  <script src="Shop.js"></script>
  <script src="ShopIcons.js"></script>
  <script src="Intro.js"></script>
  <script src="Extras.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      if (canvas) {
        window.game = new Game(canvas);
      }
    });
  </script>

</body>
</html>
